[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yt-downloader"
dynamic = ["version"]
description = "A clean Linux desktop app for downloading video and audio, powered by yt-dlp."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "THE VOID PROTOCOL", email = "thevoidofficialprivacy@gmail.com" }]
maintainers = [{ name = "MRVIMA (VOIDVIMA)", email = "thevoidofficialprivacy@gmail.com" }]
requires-python = ">=3.10"
keywords = ["youtube", "downloader", "yt-dlp", "video", "audio", "qt", "linux"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "PySide6>=6.5",
    "yt-dlp[default]>=2025.11.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/MRVIMA/yt-downloader"
Issues = "https://github.com/MRVIMA/yt-downloader/issues"

[project.scripts]
yt-downloader-cli = "yt_downloader.cli:main"

[project.gui-scripts]
yt-downloader = "yt_downloader.gui.app:main"

[tool.hatch.version]
path = "src/yt_downloader/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/yt_downloader"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
