name: AppImage build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Build on the oldest supported Ubuntu: the AppImage runs on any distro with glibc >= 2.35
    # (Ubuntu 22.04+, Debian 12+, Fedora 36+, Linux Mint 21+, openSUSE Leap 15.6+, Arch…).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends desktop-file-utils zsync \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-shape0 libfontconfig1 libdbus-1-3 xz-utils
      - name: Build AppImage
        # bash …: works even if the file lost its executable flag (e.g. uploaded via the website)
        run: bash packaging/appimage/build-appimage.sh
      - name: Checksums
        run: cd dist && sha256sum *.AppImage > SHA256SUMS-appimage.txt
      - name: Smoke test
        run: |
          app=$(ls dist/*.AppImage)
          "$app" --appimage-extract-and-run --version
          "$app" --appimage-extract-and-run cli --version
          QT_QPA_PLATFORM=offscreen timeout 15 "$app" --appimage-extract-and-run || [ $? = 124 ]
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: |
            dist/*.AppImage*
            dist/SHA256SUMS-appimage.txt
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.AppImage*
            dist/SHA256SUMS-appimage.txt
