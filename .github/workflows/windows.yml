name: Windows build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build app, portable zip and installer
        shell: pwsh
        run: .\packaging\windows\build.ps1
      - name: Smoke test
        shell: pwsh
        run: |
          & "dist\THE VOID DOWNLOADER\yt-downloader-cli.exe" --version
          & "dist\THE VOID DOWNLOADER\bin\ffmpeg.exe" -version | Select-Object -First 1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*-Setup.exe
            dist/*-Portable.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*-Setup.exe
            dist/*-Portable.zip
